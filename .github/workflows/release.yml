name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Archive
        run: |
          BARE_VERSION="${VERSION#v}"
          # Build number derived from the tag so CFBundleVersion monotonically
          # increases — Sparkle uses it to decide newer-vs-older.
          # 1.2.0 → 10200, 1.2.3 → 10203, 2.0.0 → 20000.
          BUILD_NUMBER=$(echo "$BARE_VERSION" | awk -F. '{ printf "%d", $1*10000 + $2*100 + $3 }')

          # Persist for later steps (appcast, etc.).
          echo "BARE_VERSION=$BARE_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          xcodebuild \
            -project Tomo.xcodeproj \
            -scheme Tomo \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath $RUNNER_TEMP/Tomo.xcarchive \
            MARKETING_VERSION="$BARE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/Tomo.xcarchive \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Tomo.app" "$RUNNER_TEMP/Tomo.zip"

          xcrun notarytool submit "$RUNNER_TEMP/Tomo.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$RUNNER_TEMP/export/Tomo.app"

      - name: Build DMG
        run: |
          brew install create-dmg
          mkdir -p dist
          create-dmg \
            --volname "Tomo" \
            --window-size 540 380 \
            --icon-size 96 \
            --icon "Tomo.app" 140 190 \
            --app-drop-link 400 190 \
            --hide-extension "Tomo.app" \
            "dist/Tomo-${VERSION}.dmg" \
            "$RUNNER_TEMP/export/Tomo.app"

      - name: Compute SHA256
        run: |
          shasum -a 256 "dist/Tomo-${VERSION}.dmg" | tee dist/Tomo-${VERSION}.dmg.sha256

      - name: Sign update with Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_VERSION="2.7.0"
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          KEY_FILE=$(mktemp)
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"

          SIGN_OUTPUT=$("$RUNNER_TEMP/sparkle/bin/sign_update" -f "$KEY_FILE" "dist/Tomo-${VERSION}.dmg")
          rm -f "$KEY_FILE"

          # SIGN_OUTPUT is: sparkle:edSignature="..." length="..."
          echo "SPARKLE_SIGN=$SIGN_OUTPUT" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tomo-*.dmg
            dist/Tomo-*.dmg.sha256
          generate_release_notes: true

      # Without symbols, Sentry shows Tomo's own frames as <unknown> and
      # every hang/crash is unattributable. The archive step already emits
      # dSYMs (Release is dwarf-with-dsym). Runs after the release exists
      # so a Sentry outage can't block shipping the DMG.
      - name: Upload dSYMs to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pdrbrnd
          SENTRY_PROJECT: tomo-macos
        run: |
          curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION="3.7.0" bash
          sentry-cli debug-files upload --include-sources "$RUNNER_TEMP/Tomo.xcarchive/dSYMs"

      - name: Update appcast and landing page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          DMG_URL="https://github.com/${REPO}/releases/download/${VERSION}/Tomo-${VERSION}.dmg"
          PUB_DATE=$(LC_ALL=en_US.UTF-8 date -u +"%a, %d %b %Y %H:%M:%S +0000")

          # Pull release notes — softprops/action-gh-release just generated them.
          gh api "repos/${REPO}/releases/tags/${VERSION}" --jq .body > "$RUNNER_TEMP/release_notes.md"

          # Clone main fresh; the workflow runs in detached HEAD on the tag.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"

          # Build the new <item> block. Variables expand; release notes land
          # in CDATA so they don't need escaping. sparkle:version is the
          # integer build number Sparkle compares; shortVersionString is the
          # human-readable label users see in the dialog.
          cat > "$RUNNER_TEMP/new_item.xml" <<APPCAST_ITEM
                  <item>
                      <title>${VERSION}</title>
                      <pubDate>${PUB_DATE}</pubDate>
                      <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                      <sparkle:shortVersionString>${BARE_VERSION}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                      <description><![CDATA[
          $(cat "$RUNNER_TEMP/release_notes.md")
                      ]]></description>
                      <enclosure url="${DMG_URL}" type="application/octet-stream" ${SPARKLE_SIGN} />
                  </item>
          APPCAST_ITEM

          # Insert the new item directly before </channel>.
          awk -v insert_file="$RUNNER_TEMP/new_item.xml" '
              /<\/channel>/ {
                  while ((getline line < insert_file) > 0) print line
                  close(insert_file)
              }
              { print }
          ' docs/appcast.xml > "$RUNNER_TEMP/appcast.new"
          mv "$RUNNER_TEMP/appcast.new" docs/appcast.xml

          # Bake the new tag into the landing-page download link. Match any
          # vX.Y.Z so the rewrite is idempotent regardless of the previous
          # value.
          sed -i '' -E "s|/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/Tomo-v[0-9]+\.[0-9]+\.[0-9]+\.dmg|/releases/download/${VERSION}/Tomo-${VERSION}.dmg|g" docs/index.html
          sed -i '' -E "s|data-version=\"v[0-9]+\.[0-9]+\.[0-9]+\"|data-version=\"${VERSION}\"|g" docs/index.html

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml docs/index.html
          git commit -m "appcast: ${VERSION}"
          git push origin main

      - name: Bump Homebrew cask
        env:
          TAP_PAT: ${{ secrets.TAP_PAT }}
        run: |
          BARE_VERSION="${VERSION#v}"
          SHA=$(shasum -a 256 "dist/Tomo-${VERSION}.dmg" | awk '{print $1}')

          git clone "https://x-access-token:${TAP_PAT}@github.com/pdrbrnd/homebrew-tap.git" tap
          cd tap

          # macOS BSD sed needs the empty '' after -i for in-place edit.
          sed -i '' "s|version \"[^\"]*\"|version \"$BARE_VERSION\"|" Casks/tomo.rb
          sed -i '' "s|sha256 \"[^\"]*\"|sha256 \"$SHA\"|" Casks/tomo.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet Casks/tomo.rb; then
            echo "Cask already at $BARE_VERSION — nothing to commit."
          else
            git add Casks/tomo.rb
            git commit -m "tomo $BARE_VERSION"
            git push
          fi
