name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Archive
        run: |
          xcodebuild \
            -project Tomo.xcodeproj \
            -scheme Tomo \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath $RUNNER_TEMP/Tomo.xcarchive \
            archive

      - name: Export
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/Tomo.xcarchive \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Tomo.app" "$RUNNER_TEMP/Tomo.zip"

          xcrun notarytool submit "$RUNNER_TEMP/Tomo.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$RUNNER_TEMP/export/Tomo.app"

      - name: Build DMG
        run: |
          brew install create-dmg
          mkdir -p dist
          create-dmg \
            --volname "Tomo" \
            --window-size 540 380 \
            --icon-size 96 \
            --icon "Tomo.app" 140 190 \
            --app-drop-link 400 190 \
            --hide-extension "Tomo.app" \
            "dist/Tomo-${VERSION}.dmg" \
            "$RUNNER_TEMP/export/Tomo.app"

      - name: Compute SHA256
        run: |
          shasum -a 256 "dist/Tomo-${VERSION}.dmg" | tee dist/Tomo-${VERSION}.dmg.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tomo-*.dmg
            dist/Tomo-*.dmg.sha256
          generate_release_notes: true
